# Plain English contract wording: no warning.
[[case]]
id = "english-contract-paragraph"
text = """
This Agreement renews automatically for further 12-month periods unless either party gives 30 days' written notice before the end of the current period. The Developer will provide the Services with reasonable skill and care and in line with good industry practice. Invoices will be paid within 60 days of the invoice date. Each party will keep the other's confidential information private and use it only for this Agreement."""
warned = false

