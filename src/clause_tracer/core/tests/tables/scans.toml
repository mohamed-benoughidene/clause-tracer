# Expected answers. Only the owner edits this file. Constitution T11.
# Format: docs/plans/stage-01-core.md, task S1-M5-T1.

[lists]
law_words = ["legal", "illegal", "lawful", "unlawful", "enforceable", "unenforceable", "the law"]
advice_phrases = ["safe to sign", "you should sign", "do not sign", "don't sign", "we recommend"]
injection_phrases = ["ignore", "disregard", "mark every", "system prompt"]
contact_words = ["call", "visit"]
first_person_words = ["I", "I'm", "I'd", "I'll", "I've", "we", "we're", "we'd", "we'll", "we've", "my", "our"]
filler_phrases = ["certainly", "here is", "here's", "I hope", "it's important to note", "please note", "overall", "in summary", "as an AI", "feel free", "rest assured", "crucial", "ensure that"]
evaluative_words = ["fair", "unfair", "concerning", "problematic", "favourable", "standard", "typical", "risky"]
abbreviations = ["e.g.", "i.e.", "etc.", "approx.", "no.", "cl.", "mr.", "mrs.", "ms.", "dr.", "vs."]

[caps]
reason = 280
reading = 200
question = 200
message = 3000
rewrite = 2000

