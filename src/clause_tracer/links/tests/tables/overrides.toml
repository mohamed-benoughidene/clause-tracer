# Expected answers. Only the owner edits this file. Constitution T11.
# Format: docs/plans/stage-03-links.md, task S3-M4-T3.

# Testing strategy 4: "Notwithstanding Clause 4": clause 9 overrides clause 4.
[[case]]
id = "notwithstanding-clause-4"
clauses = [
  { id = "4", sentences = ["4. Fees are fixed."] },
  { id = "9", sentences = ["9. Notwithstanding Clause 4, the Agency may change the fees."] },
]
overrides = [
  { clause = "9", target = "4", overrides_target = true, evidence = "Notwithstanding Clause 4" },
]

# Testing strategy 4: "Subject to Clause 4": clause 4 qualifies clause 9.
[[case]]
id = "subject-to-clause-4"
clauses = [
  { id = "4", sentences = ["4. Fees are fixed."] },
  { id = "9", sentences = ["9. Subject to Clause 4, the Agency may change the fees."] },
]
overrides = [
  { clause = "9", target = "4", overrides_target = false, evidence = "Subject to Clause 4" },
]

# Question 5: a target that does not exist gives no override. The reference is kept elsewhere.
[[case]]
id = "unresolved-target"
clauses = [
  { id = "9", sentences = ["9. Subject to clause 7, fees are fixed."] },
]
overrides = []

# One list gives one override for each clause in it.
[[case]]
id = "notwithstanding-a-list"
clauses = [
  { id = "4", sentences = ["4. Fees are fixed."] },
  { id = "5", sentences = ["5. Payment is monthly."] },
  { id = "9", sentences = ["9. Notwithstanding clauses 4 and 5, fees are fixed."] },
]
overrides = [
  { clause = "9", target = "4", overrides_target = true, evidence = "Notwithstanding clauses 4 and 5" },
  { clause = "9", target = "5", overrides_target = true, evidence = "Notwithstanding clauses 4 and 5" },
]

# The sample's clause 14.2: this Agreement wins over Schedule 1. The evidence is the whole sentence.
[[case]]
id = "agreement-prevails-over-schedule"
clauses = [
  { id = "14.2", sentences = ["14.2 If this Agreement and Schedule 1 conflict, this Agreement prevails."] },
  { id = "S1", number = "Schedule 1", heading = "Fees", sentences = ["Schedule 1 · Fees"] },
]
overrides = [
  { clause = "14.2", target = "S1", overrides_target = true, evidence = "14.2 If this Agreement and Schedule 1 conflict, this Agreement prevails." },
]

# The schedule wins, so Schedule 1 qualifies clause 14.2.
[[case]]
id = "schedule-prevails"
clauses = [
  { id = "14.2", sentences = ["14.2 If this Agreement and Schedule 1 conflict, Schedule 1 prevails."] },
  { id = "S1", number = "Schedule 1", heading = "Fees", sentences = ["Schedule 1 · Fees"] },
]
overrides = [
  { clause = "14.2", target = "S1", overrides_target = false, evidence = "14.2 If this Agreement and Schedule 1 conflict, Schedule 1 prevails." },
]

# Question 4: "..., this Clause prevails." with nothing after the verb names nothing, so it joins every trail.
[[case]]
id = "conflict-naming-nothing"
clauses = [
  { id = "9", sentences = ["9. If any term conflicts, then this Clause prevails."] },
]
overrides = [
  { clause = "9", target = "", overrides_target = true, evidence = "9. If any term conflicts, then this Clause prevails." },
]

# Question 4: "this Agreement prevails" with no loser gives nothing.
[[case]]
id = "agreement-prevails-naming-nothing"
clauses = [
  { id = "9", sentences = ["9. For the avoidance of doubt, this Agreement prevails."] },
]
overrides = []

# Question 4: "Notwithstanding anything in this Agreement" names nothing, so it joins every trail.
[[case]]
id = "general-notwithstanding"
clauses = [
  { id = "9", sentences = ["9. Notwithstanding anything in this Agreement, the Developer keeps their own tools."] },
]
overrides = [
  { clause = "9", target = "", overrides_target = true, evidence = "Notwithstanding anything in this Agreement" },
]

# The sample's clause 11.1: "except as set out in" a document that is not loaded is no override.
[[case]]
id = "except-as-set-out-in-the-master-agreement"
clauses = [
  { id = "11.1", sentences = ["11.1 The cap is the fees paid, except as set out in the Master Agreement."] },
]
overrides = []

# Question 4: the sample's carve-out in clause 8.2 is a cross-reference only, not an override.
[[case]]
id = "carve-out-is-no-override"
clauses = [
  { id = "8.1", sentences = ["8.1 Each party keeps the other's information private."] },
  { id = "8.2", sentences = ["8.2 Clause 8.1 does not apply to public information."] },
]
overrides = []
