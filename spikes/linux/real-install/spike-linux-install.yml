# Throwaway trial checks. This branch is never merged.
# Proves the Linux packaging spike (spikes/linux/keep/) actually installs and
# runs with a real package manager and real root: apt/.deb on Ubuntu,
# dnf/tar.gz on Fedora. The earlier spike only ran in a no-root bwrap sandbox
# on Debian 13.
name: spike-linux-install
on:
  push:
    # tmp/linux-install-base is this task's working branch. If this file is
    # pushed to watch a live run, it goes to a separate new throwaway remote
    # branch (never spike/windows-checks or another branch in use), so that
    # branch name is also listed here.
    branches: ["tmp/linux-install-base", "spike/packaging-linux-trial"]
permissions:
  contents: read

jobs:
  ubuntu-apt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # No actions/setup-python here on purpose: that action installs its own,
      # separate Python build and puts it first on PATH, shadowing the
      # distro's own python3 under the bare "python"/"python3" names too.
      # pywebview's GTK backend needs PyGObject (the "gi" module), which the
      # distro's python3-gi package installs into the DISTRO python3's own
      # dist-packages, not into whatever setup-python put on PATH. Using the
      # distro's own /usr/bin/python3 with --system-site-packages is what
      # lets the venv see it.

      - name: apt-get update
        if: always()
        run: sudo apt-get update

      - name: Install PyGObject (gi) from the distro, so the venv can see it
        if: always()
        run: sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0

      - name: Build venv and install pywebview/pyinstaller
        if: always()
        run: |
          # --system-site-packages: pywebview's GTK backend needs the "gi"
          # module, which comes from the distro's python3-gi, not from pip.
          /usr/bin/python3 -m venv --system-site-packages .venv-spike
          .venv-spike/bin/pip install --no-cache-dir pywebview pyinstaller
          .venv-spike/bin/pip list

      - name: Build frozen app (variant B)
        if: always()
        run: |
          SPIKE_VARIANT=B .venv-spike/bin/pyinstaller --noconfirm spikes/linux/keep/trial.spec
          ls -la dist/clause-tracer-trial

      - name: Lay out and build the .deb
        if: always()
        run: |
          set -eu
          ROOT=debroot
          rm -rf "$ROOT"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/opt/clause-tracer-trial" "$ROOT/usr/bin" "$ROOT/usr/share/applications"
          cp -a dist/clause-tracer-trial/. "$ROOT/opt/clause-tracer-trial/"
          install -m 755 spikes/linux/keep/clause-tracer-trial.launcher "$ROOT/usr/bin/clause-tracer-trial"
          install -m 644 spikes/linux/keep/clause-tracer-trial.desktop "$ROOT/usr/share/applications/clause-tracer-trial.desktop"

          # The saved deb-control Depends: line was worked out for Debian 13
          # package names. Ubuntu 22.04 (jammy) predates the "t64" time_t
          # transition that Debian 13 and Ubuntu 24.04 both carry, so the
          # t64-suffixed runtime packages don't exist there. Everything else
          # in the line is unchanged.
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            DEPENDS="libc6 (>= 2.35), libwebkit2gtk-4.1-0, gir1.2-webkit2-4.1, gir1.2-gtk-3.0, libgirepository-1.0-1, libglib2.0-0, libcairo2, libcairo-gobject2, libffi8, libssl3, libbz2-1.0, liblzma5, zlib1g, libexpat1, libuuid1"
          else
            DEPENDS="libc6 (>= 2.38), libwebkit2gtk-4.1-0, gir1.2-webkit2-4.1, gir1.2-gtk-3.0, libgirepository-1.0-1, libglib2.0-0t64, libcairo2, libcairo-gobject2, libffi8, libssl3t64, libbz2-1.0, liblzma5, zlib1g, libexpat1, libuuid1"
          fi

          {
            printf 'Package: clause-tracer-trial\n'
            printf 'Version: 0.0.1~spike1\n'
            printf 'Architecture: amd64\n'
            printf 'Maintainer: Clause Tracer spike <spike@example.invalid>\n'
            printf 'Section: utils\n'
            printf 'Priority: optional\n'
            printf 'Depends: %s\n' "$DEPENDS"
            printf 'Description: Clause Tracer packaging trial (throwaway)\n'
            printf ' PyInstaller one-folder build of a pywebview GTK window that uses the\n'
            printf ' system WebKitGTK. Not a product.\n'
          } > "$ROOT/DEBIAN/control"
          cat "$ROOT/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$ROOT" clause-tracer-trial_0.0.1~spike1_amd64.deb
          dpkg-deb --info clause-tracer-trial_0.0.1~spike1_amd64.deb

      - name: Real apt install (real dependency resolution)
        if: always()
        run: |
          sudo apt-get install -y ./clause-tracer-trial_0.0.1~spike1_amd64.deb
          dpkg -s clause-tracer-trial

      - name: Install Xvfb and run the installed app for real
        if: always()
        run: |
          sudo apt-get install -y xvfb
          # WebKitGTK sandboxes its Web/Network processes with bubblewrap
          # user namespaces by default; recent Ubuntu images restrict
          # unprivileged user namespaces, which can make the window never
          # become ready. There is no GPU here either, so force software GL.
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          export LIBGL_ALWAYS_SOFTWARE=1
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export GDK_BACKEND=x11
          export NO_AT_BRIDGE=1
          xvfb-run -a clause-tracer-trial | tee run.log || true
          echo "---- RESULT line ----"
          grep '^RESULT=' run.log || echo "NO RESULT LINE FOUND"

      - name: Check js_api round trip and page load from RESULT=
        if: always()
        run: |
          set -eu
          python3 - <<'PY'
          import json, sys
          with open("run.log") as fh:
              line = next((l for l in fh if l.startswith("RESULT=")), None)
          if not line:
              print("FAIL: no RESULT= line")
              sys.exit(1)
          data = json.loads(line[len("RESULT="):])
          checks = {
              "frozen": data.get("frozen") is True,
              "page_a_exists": data.get("page_a_exists") is True,
              "a_api_ready": data.get("a_api_ready") is True,
              "roundtrip_before": data.get("a_roundtrip", {}).get("before", {}).get("theme") == "light",
              "roundtrip_after": data.get("a_roundtrip", {}).get("read_back", {}).get("theme") == "dark",
              "reached_b": data.get("c_reached_b") is True,
              "api_ready_on_b": data.get("c_api_ready_on_b") is True,
          }
          print(json.dumps(checks, indent=2))
          if not all(checks.values()):
              print("FAIL: one or more checks false")
              sys.exit(1)
          print("PASS: js_api round trip and page A->B navigation confirmed")
          PY

      - name: Desktop file present and valid
        if: always()
        run: |
          test -f /usr/share/applications/clause-tracer-trial.desktop && echo "desktop file present"
          if command -v desktop-file-validate >/dev/null; then
            desktop-file-validate /usr/share/applications/clause-tracer-trial.desktop && echo "PASS: desktop-file-validate"
          else
            echo "desktop-file-validate not available on this image"
          fi

      - name: Confirm host WebKitGTK is loaded, not a bundled copy
        if: always()
        run: |
          set -eu
          echo "---- ldd on the installed executable ----"
          ldd /opt/clause-tracer-trial/clause-tracer-trial || true
          echo "---- bundle contents: any libwebkit2gtk/libgtk/libglib shipped? ----"
          find /opt/clause-tracer-trial -iname '*webkit2gtk*' -o -iname '*libgtk-3*' -o -iname '*libglib-2.0*' | tee bundled-libs.txt
          if [ -s bundled-libs.txt ]; then
            echo "FAIL: spec filter left host libs in the bundle"
            exit 1
          else
            echo "PASS: no libwebkit2gtk/libgtk-3/libglib-2.0 shipped in the bundle (host copies must be used)"
          fi
          dpkg -L libwebkit2gtk-4.1-0 | grep '\.so' || true

      - name: Clean removal
        if: always()
        run: |
          sudo apt-get remove -y clause-tracer-trial
          if dpkg -s clause-tracer-trial >/dev/null 2>&1; then
            echo "FAIL: package still reports installed"
            exit 1
          fi
          if [ -e /opt/clause-tracer-trial ] || [ -e /usr/bin/clause-tracer-trial ] || [ -e /usr/share/applications/clause-tracer-trial.desktop ]; then
            echo "FAIL: files remain after removal"
            exit 1
          fi
          echo "PASS: clean removal, no files left behind"

  fedora-dnf:
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: Install git (needed before actions/checkout can run)
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: dnf install runtime and build dependencies
        if: always()
        run: |
          # iproute provides "ss", which the trial app uses to check that
          # no TCP socket is listening (it failed with FileNotFoundError
          # without this).
          dnf install -y python3 python3-pip python3-gobject gtk3 webkit2gtk4.1 xorg-x11-server-Xvfb \
            desktop-file-utils findutils which binutils iproute
          dnf list installed python3-gobject gtk3 webkit2gtk4.1

      - name: Build venv and install pywebview/pyinstaller
        if: always()
        run: |
          # --system-site-packages: python3-gobject is a dnf package, not a
          # pip one, so the venv needs to see the system site-packages to
          # import "gi". binutils (objdump) is needed by PyInstaller on Linux.
          python3 -m venv --system-site-packages .venv-spike
          .venv-spike/bin/pip install --no-cache-dir pywebview pyinstaller
          .venv-spike/bin/pip list

      - name: Build frozen app (variant B)
        if: always()
        run: |
          SPIKE_VARIANT=B .venv-spike/bin/pyinstaller --noconfirm spikes/linux/keep/trial.spec
          ls -la dist/clause-tracer-trial

      - name: Confirm the spec's basename filter also works on Fedora's lib64 layout
        if: always()
        run: |
          echo "---- any webkit2gtk/gtk-3/glib-2.0 shipped in the bundle? ----"
          find dist/clause-tracer-trial -iname '*webkit2gtk*' -o -iname '*libgtk-3*' -o -iname '*libglib-2.0*' | tee /tmp/bundled-libs-fedora.txt
          if [ -s /tmp/bundled-libs-fedora.txt ]; then
            echo "FAIL: host libs leaked into the Fedora bundle"
            exit 1
          fi
          echo "PASS: basename-based filter also excludes the Fedora (lib64) copies"

      - name: Lay out a tar.gz-style install under /opt by hand (no .deb tooling on Fedora)
        if: always()
        run: |
          set -eu
          rm -rf /opt/clause-tracer-trial
          mkdir -p /opt/clause-tracer-trial
          cp -a dist/clause-tracer-trial/. /opt/clause-tracer-trial/
          install -D -m 755 spikes/linux/keep/clause-tracer-trial.launcher /usr/bin/clause-tracer-trial
          install -D -m 644 spikes/linux/keep/clause-tracer-trial.desktop /usr/share/applications/clause-tracer-trial.desktop
          ls -la /opt/clause-tracer-trial /usr/bin/clause-tracer-trial

      - name: Run the installed app for real under Xvfb
        if: always()
        run: |
          xvfb-run -a clause-tracer-trial | tee run.log || true
          echo "---- RESULT line ----"
          grep '^RESULT=' run.log || echo "NO RESULT LINE FOUND"

      - name: Check js_api round trip and page load from RESULT= (Fedora)
        if: always()
        run: |
          set -eu
          python3 - <<'PY'
          import json, sys
          with open("run.log") as fh:
              line = next((l for l in fh if l.startswith("RESULT=")), None)
          if not line:
              print("FAIL: no RESULT= line")
              sys.exit(1)
          data = json.loads(line[len("RESULT="):])
          checks = {
              "frozen": data.get("frozen") is True,
              "page_a_exists": data.get("page_a_exists") is True,
              "a_api_ready": data.get("a_api_ready") is True,
              "roundtrip_before": data.get("a_roundtrip", {}).get("before", {}).get("theme") == "light",
              "roundtrip_after": data.get("a_roundtrip", {}).get("read_back", {}).get("theme") == "dark",
              "reached_b": data.get("c_reached_b") is True,
              "api_ready_on_b": data.get("c_api_ready_on_b") is True,
          }
          print(json.dumps(checks, indent=2))
          if not all(checks.values()):
              print("FAIL: one or more checks false")
              sys.exit(1)
          print("PASS: js_api round trip and page A->B navigation confirmed on Fedora")
          PY

      - name: Desktop file valid (Fedora)
        if: always()
        run: |
          test -f /usr/share/applications/clause-tracer-trial.desktop && echo "desktop file present"
          if command -v desktop-file-validate >/dev/null; then
            desktop-file-validate /usr/share/applications/clause-tracer-trial.desktop && echo "PASS: desktop-file-validate"
          else
            echo "desktop-file-validate not available in this container"
          fi

      - name: Confirm host WebKitGTK is loaded, not a bundled copy (Fedora lib64)
        if: always()
        run: |
          set -eu
          echo "---- ldd on the installed executable ----"
          ldd /opt/clause-tracer-trial/clause-tracer-trial || true
          echo "---- where does Fedora actually keep libwebkit2gtk-4.1? ----"
          rpm -ql webkit2gtk4.1 | grep '\.so' || true
          echo "---- repeat: no shipped copy in the bundle ----"
          find /opt/clause-tracer-trial -iname '*webkit2gtk*' -o -iname '*libgtk-3*' -o -iname '*libglib-2.0*' | tee /tmp/bundled-libs-fedora-2.txt
          if [ -s /tmp/bundled-libs-fedora-2.txt ]; then
            echo "FAIL: host libs present in the installed bundle"
            exit 1
          else
            echo "PASS: installed bundle has no bundled webkit2gtk/gtk-3/glib-2.0, must load Fedora's /usr/lib64 copies"
          fi
