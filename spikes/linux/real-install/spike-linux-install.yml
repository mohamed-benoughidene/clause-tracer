# Throwaway trial checks. This branch is never merged.
# Round 2: does the installed trial app work on Ubuntu 26.04 and under Wayland?
name: spike-linux-install
on:
  push:
    branches: ["spike/packaging-linux-trial"]
permissions:
  contents: read

env:
  DEB: clause-tracer-trial_0.0.1~spike1_amd64.deb

jobs:
  survey:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest}
          - {os: ubuntu-26.04}
    runs-on: ${{ matrix.os }}
    name: survey (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - run: spikes/linux/keep/ci-pkg-survey.sh

  survey-container:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - run: apt-get update -qq && apt-get install -y git ca-certificates
      - uses: actions/checkout@v4
      - run: spikes/linux/keep/ci-pkg-survey.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, tag: u2404, flavour: t64}
          - {os: ubuntu-26.04, tag: r2604, flavour: auto}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: head -4 /etc/os-release; python3 --version
      - run: sudo apt-get update && sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-gtk-3.0 binutils
      - run: |
          /usr/bin/python3 -m venv --system-site-packages .venv-spike
          .venv-spike/bin/pip install --no-cache-dir pywebview pyinstaller
          .venv-spike/bin/pip list
          dpkg -l | grep -E 'python3-gi|libgirepository|libglib2.0-0' || true
      - run: |
          . .venv-spike/bin/activate
          spikes/linux/keep/ci-build-deb.sh ${{ matrix.flavour }}
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.tag }}
          path: ${{ env.DEB }}

  # Runner VMs: installed .deb under X11 (xvfb) or headless Wayland (weston), with and without dbus-run-session.
  vm-run:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.04 control, native deb
          - {os: ubuntu-24.04, deb: u2404, display: x11, dbus: "1", extra: "", cross: ""}
          - {os: ubuntu-24.04, deb: u2404, display: wayland, dbus: "0", extra: "", cross: ""}
          - {os: ubuntu-24.04, deb: u2404, display: wayland, dbus: "1", extra: "", cross: ""}
          - {os: ubuntu-24.04, deb: u2404, display: wayland, dbus: "1", extra: "LIBGL_ALWAYS_SOFTWARE=1", cross: ""}
          - {os: ubuntu-24.04, deb: u2404, display: wayland, dbus: "1", extra: "WEBKIT_DISABLE_DMABUF_RENDERER=1", cross: ""}
          # 26.04, deb built on 26.04
          - {os: ubuntu-26.04, deb: r2604, display: x11, dbus: "1", extra: "", cross: ""}
          - {os: ubuntu-26.04, deb: r2604, display: x11, dbus: "0", extra: "", cross: ""}
          - {os: ubuntu-26.04, deb: r2604, display: wayland, dbus: "0", extra: "", cross: ""}
          - {os: ubuntu-26.04, deb: r2604, display: wayland, dbus: "1", extra: "", cross: ""}
          - {os: ubuntu-26.04, deb: r2604, display: wayland, dbus: "1", extra: "LIBGL_ALWAYS_SOFTWARE=1", cross: ""}
          - {os: ubuntu-26.04, deb: r2604, display: wayland, dbus: "1", extra: "WEBKIT_DISABLE_DMABUF_RENDERER=1", cross: ""}
          # 26.04 with the deb built on 24.04 (forward compatibility of one build)
          - {os: ubuntu-26.04, deb: u2404, display: x11, dbus: "1", extra: "", cross: "cross"}
          - {os: ubuntu-26.04, deb: u2404, display: wayland, dbus: "1", extra: "", cross: "cross"}
    runs-on: ${{ matrix.os }}
    name: vm (${{ matrix.os }}, deb ${{ matrix.deb }}, ${{ matrix.display }}, dbus-run-session=${{ matrix.dbus }}, ${{ matrix.extra || 'no extras' }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb-${{ matrix.deb }}
      - run: spikes/linux/keep/ci-install.sh "$DEB" ${{ matrix.cross }}
      - run: head -3 /etc/os-release; spikes/linux/keep/ci-bus-diag.sh
      - name: Run the installed app
        run: |
          if [ "${{ matrix.dbus }}" = "0" ]; then export NO_DBUS=1; fi
          if [ "${{ matrix.display }}" = "wayland" ]; then
            ${{ matrix.extra }} spikes/linux/keep/ci-run-wayland.sh run.log clause-tracer-trial
          else
            ${{ matrix.extra }} spikes/linux/keep/ci-run.sh run.log clause-tracer-trial
          fi
      - name: Check RESULT=
        env:
          EXPECT_DISPLAY: ${{ matrix.display == 'wayland' && 'GdkWaylandDisplay' || 'GdkX11Display' }}
        run: python3 spikes/linux/keep/check-result.py run.log.clean
      - name: Desktop file, host libs, clean removal
        if: always()
        run: spikes/linux/keep/ci-deb-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-vm-${{ matrix.os }}-${{ matrix.deb }}-${{ matrix.display }}-dbus${{ matrix.dbus }}-${{ matrix.extra }}
          path: run*.log*

  # Containers (root): image x deb, X11 then Wayland (both with and without dbus-run-session).
  container-run:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: "ubuntu:26.04", deb: r2604, cross: ""}
          - {image: "ubuntu:26.04", deb: u2404, cross: "cross"}
          - {image: "ubuntu:24.04", deb: u2404, cross: ""}
    name: container (${{ matrix.image }}, deb ${{ matrix.deb }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
      - run: apt-get update -qq && apt-get install -y git ca-certificates
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb-${{ matrix.deb }}
      - run: head -3 /etc/os-release; spikes/linux/keep/ci-install.sh "$DEB" ${{ matrix.cross }}
      - name: X11 run
        run: spikes/linux/keep/ci-run.sh run-x11.log clause-tracer-trial
      - name: X11 check
        env: {EXPECT_DISPLAY: GdkX11Display}
        run: python3 spikes/linux/keep/check-result.py run-x11.log.clean
      - name: Wayland run, no dbus-run-session
        if: always()
        run: NO_DBUS=1 spikes/linux/keep/ci-run-wayland.sh run-wl0.log clause-tracer-trial
      - name: Wayland check (no dbus-run-session)
        if: always()
        env: {EXPECT_DISPLAY: GdkWaylandDisplay}
        run: python3 spikes/linux/keep/check-result.py run-wl0.log.clean
      - name: Wayland run, dbus-run-session
        if: always()
        run: spikes/linux/keep/ci-run-wayland.sh run-wl1.log clause-tracer-trial
      - name: Wayland check (dbus-run-session)
        if: always()
        env: {EXPECT_DISPLAY: GdkWaylandDisplay}
        run: python3 spikes/linux/keep/check-result.py run-wl1.log.clean
      - name: Desktop file, host libs, clean removal
        if: always()
        run: spikes/linux/keep/ci-deb-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-container-${{ matrix.image }}-${{ matrix.deb }}
          path: run*.log*

  fedora-wayland:
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - run: dnf install -y git
      - uses: actions/checkout@v4
      - run: |
          dnf install -y python3 python3-pip python3-gobject gtk3 webkit2gtk4.1 xorg-x11-server-Xvfb weston \
            desktop-file-utils findutils which binutils iproute dbus-daemon
      - run: |
          python3 -m venv --system-site-packages .venv-spike
          .venv-spike/bin/pip install --no-cache-dir pywebview pyinstaller
      - run: SPIKE_VARIANT=B .venv-spike/bin/pyinstaller --noconfirm spikes/linux/keep/trial.spec
      - run: |
          set -eu
          mkdir -p /opt/clause-tracer-trial
          cp -a dist/clause-tracer-trial/. /opt/clause-tracer-trial/
          install -D -m 755 spikes/linux/keep/clause-tracer-trial.launcher /usr/bin/clause-tracer-trial
      - name: Wayland run, no dbus-run-session
        run: NO_DBUS=1 spikes/linux/keep/ci-run-wayland.sh run-wl0.log clause-tracer-trial
      - name: Check
        env: {EXPECT_DISPLAY: GdkWaylandDisplay}
        run: python3 spikes/linux/keep/check-result.py run-wl0.log.clean
      - name: Wayland run, dbus-run-session
        if: always()
        run: spikes/linux/keep/ci-run-wayland.sh run-wl1.log clause-tracer-trial
      - name: Check (dbus-run-session)
        if: always()
        env: {EXPECT_DISPLAY: GdkWaylandDisplay}
        run: python3 spikes/linux/keep/check-result.py run-wl1.log.clean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-fedora-wayland
          path: run*.log*
